server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 100s;
        proxy_connect_timeout 5s;
        # Keep real Origin and cookies; do not trust client-supplied forwarded identities.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location / { try_files $uri $uri/ /index.html; }
    # Nginx does not inherit parent add_header directives when a location
    # declares its own. Repeat the security contract for the SPA entry point.
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
